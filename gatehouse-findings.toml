[[findings]]
agent = "security"
category = "security"
file = "scripts/provision-cosign-env.py"
evidence = "def branch_problems(gh: Gh, repo: str, default: str) -> list[str]:\n    \"\"\"The default branch's effective rules, from every active ruleset.\"\"\"\n    have = {rule[\"type\"] for rule in gh.listed(f\"repos/{repo}/rules/branches/{default}\")}\n    return [f\"{default} has no '{rule}' rule\" for rule in BRANCH_RULES if rule not in have]"
status = "not-a-bug"
reason = "The fleet merges its own pull requests once the organization ruleset's required checks pass (Gatehouse triage, sdlc ci, Validate constitution); no repo requires a second human's approval, so demanding one would refuse every signer. The gate the brief set is a required pull request, no force-push and no deletion, which this verifies."
