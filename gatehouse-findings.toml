[[findings]]
agent = "performance"
category = "performance"
file = "scripts/release_alert.py"
evidence = "\"number,title,author,body\""
status = "not-a-bug"
reason = "The listing is filtered by --label container-release, so it returns only this workflow's few alert issues, whose bodies are two sentences; a second gh call per legacy issue would cost more than it saves."

[[findings]]
