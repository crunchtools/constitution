# Machine-checked requirements for manifest constitutions (Inherits >= v1.18.0).
#
# validate-constitution.py reads this file from the constitution checkout it runs
# from, so the rules a repo is judged by come from the tag it pins. Prose in
# constitution.md and profiles/*.md explains the why; this file is what is
# enforced. A rule that lives only in prose is reported as prose-only.

[fleet]
# Repos call crunchtools/gatehouse at its major tag (`@v0`), which each release
# moves. This is the oldest release a repo may name instead: its major is the
# oldest major tag accepted, and an exact pin (`@vX.Y.Z`) must be at least this.
gatehouse_min = "0.15.0"

# Files every repo carries (globs relative to the repo root).
files = ["CHANGELOG.md", ".pre-commit-config.yaml", ".github/dependabot.yml"]

# What a developer machine has (XII host contract): the only programs a
# `language: system` pre-commit hook may start, besides scripts in the repo.
host_tools = ["git", "podman", "pre-commit", "gh"]

# Dependabot ecosystems every repo keeps current (XV).
dependabot = ["github-actions"]

# The repo must carry an AGPL-3.0 LICENSE (I). Profiles may turn this off.
license_agpl = true

# Where a release states its version (II, repos inheriting v1.28.0 or later).
# Every SemVer value a pattern's first group captures must equal the newest
# released `## [X.Y.Z]` heading in CHANGELOG.md. A file that is absent is fine.
[[fleet.version_files]]
glob = "pyproject.toml"
pattern = '^version\s*=\s*"([^"]+)"'

[[fleet.version_files]]
glob = "src/*/__init__.py"
pattern = '''^__version__\s*=\s*["']([^"']+)["']'''

[[fleet.version_files]]
glob = "server.json"
pattern = '"version"\s*:\s*"([^"]+)"'

[[fleet.version_files]]
# LABEL lines and their continuations; not org.opencontainers.image.version,
# which CI's metadata action sets.
glob = "Containerfile*"
pattern = '^\s*(?:LABEL\s+)?version="([^"]+)"'

[[fleet.version_files]]
# A FastMCP(version="...") literal; a server that imports __version__ has none.
glob = "src/*/server.py"
pattern = '^\s*version\s*=\s*"([^"]+)"'

[[fleet.version_files]]
# npm writes package.json with two-space indent, so this is the top-level key.
glob = "package.json"
pattern = '^  "version"\s*:\s*"([^"]+)"'

# Each profile adds to the fleet rules. Keys:
#   files            globs that must each match at least one path
#   dependabot       extra Dependabot ecosystems
#   license_agpl     override the fleet license rule
#   sections         headings the manifest MUST carry (repo-specific facts)
#   private          the repo MUST be private (checked through the GitHub API)
#   containerfile_from  regex a Containerfile FROM line must match
#   tests_contain    regexes that must each match in a file under test*/**/*.py
#                    (repos inheriting v1.22.0 or later)

[profile."MCP Server"]
files = ["pyproject.toml", "uv.lock", "Containerfile*", "test*/**/*.py"]
dependabot = ["uv"]
# The read-only partition test (profile Layer 2 and IV). A tripwire: the test
# itself, in the repo's own gate, is what holds the classification.
tests_contain = ["readOnlyHint"]

[profile."CLI Tool"]
files = ["pyproject.toml", "uv.lock", "Containerfile*", "test*/**/*.py"]
dependabot = ["uv"]

[profile."Container Image"]
files = ["Containerfile*"]

[profile."Web Application"]
files = ["Containerfile*"]

[profile."Autonomous Agent"]
files = ["Containerfile*"]

[profile."Forked MCP Server"]
files = ["Containerfile*"]
license_agpl = false
sections = ["Upstream", "Deployment", "Patches"]

[profile."Claude Skill"]
files = ["**/SKILL.md"]

[profile."Bootc Image"]
files = ["Containerfile*"]
containerfile_from = 'bootc'

[profile."Host Config"]
license_agpl = false
private = true

[profile."Security Gateway"]
files = ["pyproject.toml", "uv.lock", "Containerfile*", "test*/**/*.py"]
dependabot = ["uv"]
sections = ["Threat Model", "Layer Contract", "Known Gaps", "Instance"]

[profile."Governance"]
files = ["pyproject.toml", "test*/**/*.py"]

[profile."Package Repository"]
files = ["*.asc"]

[profile."Data Archive"]
files = ["README.md"]
license_agpl = false
sections = ["Producer and Scrubbing"]

[profile."Workflow Automation"]
files = ["examples/*.yml", "scripts/*", "test*/**/*.py"]
sections = ["Authority Split", "Configured Limits"]
