# Drop in as .github/dependabot.yml. See constitution.md XV.
#
# github-actions is required for every repo. Add the ecosystems your profile
# names (uv for MCP Server and CLI Tool; see examples/dependabot-uv.yml).
# crunchtools/constitution is ignored: its pin moves with `Inherits:` through
# scripts/fleet-bump.py, and a lone pin bump would fail validation.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
