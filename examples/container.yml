# Container release: build once, gate the digest, promote what was tested
# (constitution container-image VII). Copy to .github/workflows/container.yml.
#
# `boot` is required: mcp | mcp-http | systemd | healthcheck | command | none.
# See the inputs in crunchtools/constitution .github/workflows/container-release.yml.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 4 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1
    permissions:
      contents: read
      pull-requests: read
      issues: write   # a failed weekly rebuild opens (or comments on) one issue
    with:
      image: quay.io/crunchtools/EXAMPLE
      boot: mcp
      boot-env: |
        EXAMPLE_API_KEY=gate-dummy
      # Files the Containerfile never COPYs: a change touching only these
      # (a release PR) reuses the gated digest instead of building again.
      # Leave it out if the image COPYs the whole context.
      outside-image: VERSION CHANGELOG.md
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (rhel10-bootc-server#47). Provision the repo's cosign-signing
      # environment BEFORE setting this, with the constitution's
      # scripts/provision-cosign-env.py: deployment rules for main and v*
      # only, then the key. GitHub auto-creates a missing environment with no
      # rules. The key is an environment secret, never an org or repo secret
      # (any branch reads those). Without it, promote refuses.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
