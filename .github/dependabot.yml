# Canonical Dependabot config for crunchtools Python projects using uv.
# Drop in as .github/dependabot.yml. See constitution.md Section XV.
#
# Covers both ecosystems that go stale silently if left unpinned:
#   - uv:            uv.lock (must be committed, never gitignored)
#   - github-actions: `uses: some-action@vX.Y.Z` pins in .github/workflows/
#
# A repo with a Containerfile adds the commented `docker` block at the end.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # The week Renovate waits too (XV); goes with this file at v1.60.0.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The week Renovate waits too (XV); goes with this file at v1.60.0.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"

  # Containerfile base images. A new Python minor is a runtime migration, not a
  # base refresh: the uv lock is solved for one interpreter and compiled wheels
  # ship per minor, so hummingbird/python 3.14 -> 3.15 failed every trentina
  # build (#874). Dependabot counts that tag bump as minor, so it is ignored;
  # digest bumps within the tag still flow. The validator requires the ignore
  # wherever a docker block meets a FROM hummingbird/python (XV).
