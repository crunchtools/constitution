name: Fleet Bump

# Runs scripts/fleet-bump.py in the pipeline, so fleet rollouts need no gh or
# org-wide token on a seat (a867). Dry run by default: the job summary lists
# every repo that would get a PR, which is the rollout's real count. A real run
# opens one PR per repo and queues it for auto-merge on its own required checks.
# Triggered by hand or by Josui Prime via workflow_dispatch; no schedule: trigger.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bump (Inherits after a release) or a one-off"
        type: choice
        options: [bump, zizmor-callers, renovate]
        default: bump
      version:
        description: "bump only: target X.Y.Z (default: this checkout's)"
        required: false
      only:
        description: "Comma-separated repo names (default: whole fleet)"
        required: false
      dry-run:
        description: "List what would change; open no PRs"
        type: boolean
        default: true

permissions:
  contents: read

# Two real runs at once would race each other's branches in every repo. Dry
# runs queue apart: a group keeps one pending run, so a shared group would let a
# dry run replace a pending real one.
concurrency:
  group: fleet-bump-${{ inputs.dry-run && 'dry' || 'write' }}
  cancel-in-progress: false

jobs:
  bump:
    name: Fleet bump (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # workflow_dispatch runs this file from any branch; only main's copy may
      # write to the fleet.
      - name: Refuse a real run off main
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::a real fleet bump runs from main only"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.3
      # The crunchtools-ci App's token, org-wide because the script walks the
      # whole fleet. A dry run asks for read only; a real run also needs to push
      # branches that touch workflows and to open PRs.
      - name: Mint read token
        id: read-token
        if: ${{ inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CRUNCHTOOLS_CI_CLIENT_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools  # zizmor: ignore[github-app]
          permission-contents: read
      - name: Mint write token
        id: write-token
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CRUNCHTOOLS_CI_CLIENT_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools  # zizmor: ignore[github-app]
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # fleet-bump.py clones with gh and commits with plain git: point git's
      # https credential at gh and give the commits the App's bot identity.
      - name: Configure git
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          APP_SLUG: ${{ steps.write-token.outputs.app-slug }}
        run: |
          gh auth setup-git
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Run
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token || steps.write-token.outputs.token }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ "$MODE" != bump ]; then args+=("--$MODE")
          elif [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          set +e
          python scripts/fleet-bump.py "${args[@]}" > out.txt 2> err.txt
          status=$?
          set -e
          cat out.txt err.txt
          # One unindented line per repo that needs (or got) a PR; PR URLs are indented.
          count=$(grep -c '^[^ ]' out.txt || true)
          {
            echo "### fleet-bump.py ${args[*]}"
            echo
            echo "**${count} repos** $([ "$DRY_RUN" = true ] && echo 'would get a PR' || echo 'handled')"
            echo
            echo '```'
            cat out.txt
            echo '```'
            if [ -s err.txt ]; then
              echo
              echo '#### stderr'
              echo '```'
              cat err.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
