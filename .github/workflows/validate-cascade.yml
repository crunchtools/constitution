name: Validate Cascade

# Read-only check: compares the FROM-graph (Containerfile inheritance) with the
# dispatch-graph (repository_dispatch wiring in build.yml). Fails if downstream
# repos won't rebuild when their parent image updates.
#
# Triggered on push/PR; also runs weekly via workflow_dispatch from Hermes.
# Deliberately no schedule: trigger — see chore/strip-schedule-trigger sweep.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-cascade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The crunchtools-ci App's token, not a personal one: it has its own rate
      # limit, so a busy day on someone's account can't turn this check red.
      - name: Mint CI token
        id: ci-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CRUNCHTOOLS_CI_APP_ID || secrets.CRUNCHTOOLS_CI_APP_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools

      - name: Run cascade determinism check
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: python validate-cascade.py --verbose
