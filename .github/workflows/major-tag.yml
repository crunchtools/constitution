# Major tag: deliver a published constitution release to every repo (XV rule 5).
#
# Repos call this repo's workflows at `@v1`. When a release is published this
# moves `v1` to it, and that is the whole rollout: no caller file changes
# anywhere. The release commit already passed CI and the container-release
# canary on main. The tag moves forward only. To undo a release, move the tag
# back one release by hand:
#
#   gh api -X PATCH repos/crunchtools/constitution/git/refs/tags/v1 \
#     -f sha="$(gh api repos/crunchtools/constitution/commits/v1.X.Y --jq .sha)" -F force=true
#
# A release published with GITHUB_TOKEN starts no workflow; dispatch this one
# with its tag instead.

name: Major tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to deliver, as vX.Y.Z"
        required: true
        type: string

permissions: {}

# One at a time: each run reads the tags afresh, so two releases published
# together cannot leave the major tag on the older one.
concurrency:
  group: major-tag
  cancel-in-progress: false

jobs:
  move:
    name: Move the major tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The script comes from the default branch, not from the release it
      # promotes: the code holding the write token is code already merged.
      # Pinned by SHA because this job holds `contents: write`.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Not `python3 -I`: that drops scripts/ from sys.path, and the script
      # imports container_release. The checkout is the default branch.
      - name: Move the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/major_tag.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --branch "$BRANCH"
