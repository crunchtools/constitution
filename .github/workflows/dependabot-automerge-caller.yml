name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Dependabot
    # `./`, not `$/`: validators before 1.58.0 judge this repo's PRs and read
    # `$/` as a third-party ref.
    uses: ./.github/workflows/dependabot-automerge.yml  # zizmor: ignore[self-repository]
