# Build once, gate the digest, promote what was tested (container-image VII).
#
# Callers name the major tag, which each release moves (XV rule 5); copy
# examples/container.yml:
#
#   uses: crunchtools/constitution/.github/workflows/container-release.yml@v1
#
# One build per change. A pull request builds its head commit, gates that
# digest and marks it gated-<sha>. The merge to the default branch does NOT
# rebuild: `resolve` finds the merged PR, confirms the merge commit has the
# same git tree as the head that was gated, and promote copies that digest to
# `main`. A v* tag promotes the gated digest of the tag commit to the version
# tags and `latest`. Builds happen only on pull requests, schedule and
# workflow_dispatch, plus one fallback: a merge or a release whose commit was
# never gated (a PR that could not push, a branch not up to date, or a
# path-filtered caller that built nothing for a release commit) is rebuilt
# and gated here before it can move a tag; a tag off the default branch is
# refused, and so is a release whose image is labelled another of the repo's
# releases (#171). Untested bytes never reach a floating tag on any path.
#
# `outside-image` names files the Containerfile never COPYs (VERSION,
# CHANGELOG.md). A pull request or push that changes only those reuses the
# digest gated for its base instead of building: a release PR, its merge and
# its v* tag each move tags in seconds, and a feature costs one build (RT#1660).
#
# The logic is scripts/container_release.py at the release written below as a
# literal `ref:` (a reusable workflow cannot name its own ref, #42);
# tests/test_release_workflows.py fails when it is not the newest release in CHANGELOG.md.
#
# Secrets are passed by name, never `secrets: inherit`: the gates job runs the
# caller's own boot and contract commands and holds no credentials at all.
#
# A scheduled run that fails opens one issue per image in the caller's repo, or
# comments on the one already open; the next passing run of that image closes it
# (scripts/release_alert.py, a375). The caller's job
# grants `issues: write` for that; without it the run warns instead.
#
# `sign: true` signs the digest inside promote, before any tag moves, with the
# fleet cosign key; it verifies against keys/crunchtools-bootc.pub here
# (rhel10-bootc-server#47). Only promote holds the key, so a pull request's
# candidate is never signed. Promote then attests a syft SPDX SBOM to the
# digest with that key (#203), and SLSA v1 provenance naming the run that
# built it, which build records in the image's labels (#204).

name: Container release

on:
  workflow_call:
    inputs:
      image:
        description: "Repository without tag, e.g. quay.io/crunchtools/mcp-nagios"
        type: string
        required: true
      containerfile:
        type: string
        default: Containerfile
      context:
        type: string
        default: .
      build-args:
        description: "Newline-separated KEY=VALUE build arguments"
        type: string
        default: ""
      rhsm:
        description: >-
          The Containerfile registers with RHSM through build secrets, mounted
          as `activation_key`/`org_id` or `RHSM_ACTIVATION_KEY`/`RHSM_ORG_ID`
          (both are provided); pass RHSM_ACTIVATION_KEY and RHSM_ORG_ID.
        type: boolean
        default: false
      redhat-registry:
        description: "Log in to registry.redhat.io before building (a FROM there needs it)"
        type: boolean
        default: false
      format:
        description: >-
          Image format: `docker` (default; keeps HEALTHCHECK) or `oci` (bootc
          images, which want a plain OCI manifest).
        type: string
        default: docker
      free-disk:
        description: >-
          Remove the runner's preinstalled SDKs before building and before
          gating, for multi-GB images (bootc) that do not fit otherwise.
        type: boolean
        default: false
      boot:
        description: "mcp | mcp-http | systemd | healthcheck | command | none"
        type: string
        required: true
      boot-env:
        description: "Newline-separated KEY=VALUE for the boot container (dummy values)"
        type: string
        default: ""
      boot-run-args:
        description: "Extra podman run arguments for the boot container"
        type: string
        default: ""
      boot-cmd:
        description: "Arguments after the image (mcp / mcp-http)"
        type: string
        default: ""
      boot-units:
        description: "systemd: space-separated units that must be active"
        type: string
        default: ""
      boot-port:
        type: number
        default: 8080
      boot-path:
        type: string
        default: /mcp
      boot-timeout:
        type: number
        default: 180
      boot-command:
        description: "command: shell run from the repo root with $IMAGE set; exit 0 = boots"
        type: string
        default: ""
      boot-none-reason:
        description: "none: why this image cannot be booted (required for none)"
        type: string
        default: ""
      contract-test:
        description: "Optional shell run from the repo root with $IMAGE set (profile VI)"
        type: string
        default: ""
      default-branch:
        type: string
        default: main
      cascade:
        description: "An image other images build FROM (ubi10 chain): latest tracks main"
        type: boolean
        default: false
      downstream:
        description: >-
          Space-separated crunchtools repos to rebuild after main/latest moves.
          Each receives repository_dispatch event `parent-image-updated` (the
          name the ubi10 chain already listens for) with client_payload.source
          set to this repo; a child triggers on `repository_dispatch: types:
          [parent-image-updated]`.
        type: string
        default: ""
      downstream-event:
        description: >-
          The repository_dispatch event sent to `downstream`. Use a distinct
          one when a downstream repo is THIS repo (a *-base image beside its
          app): the base workflow itself listens for parent-image-updated, so
          sending that to its own repo would rebuild the base forever.
        type: string
        default: parent-image-updated
      sign:
        description: >-
          Sign the promoted digest with cosign before any tag moves. The job
          runs in the `cosign-signing` environment (main and v*.*.* only); pass
          COSIGN_PRIVATE_KEY and COSIGN_PASSWORD by name. Off by default on
          purpose: a caller that passes no key fails promote, so turning it on
          is a caller change (examples/container.yml), never a default.
        type: boolean
        default: false
      outside-image:
        description: >-
          Space-separated globs of files that never reach the image, e.g.
          `VERSION CHANGELOG.md docs/**`. A change touching only these reuses
          the gated digest of its base (the PR's base, or the commit's first
          parent) instead of rebuilding. The caller vouches for it: list
          nothing its Containerfile COPYs, and never with `COPY . `. A
          change under .github/ always builds, so a PR cannot widen this to
          skip its own build.
        type: string
        default: ""
      constitution-ref:
        description: "Internal: the canary tests the candidate scripts. Leave empty."
        type: string
        default: ""
    secrets:
      QUAY_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false
      CRUNCHTOOLS_CI_APP_KEY:
        description: "Only with downstream: the crunchtools-ci GitHub App key"
        required: false
      RHSM_ACTIVATION_KEY:
        description: "Only with rhsm: true"
        required: false
      RHSM_ORG_ID:
        description: "Only with rhsm: true"
        required: false
      REGISTRY_REDHAT_IO_USER:
        description: "Only with redhat-registry: true"
        required: false
      REGISTRY_REDHAT_IO_PASSWORD:
        description: "Only with redhat-registry: true"
        required: false
      # Environment secrets still have to be passed by the caller; one that is
      # not resolves to an empty string, which the sign step refuses.
      COSIGN_PRIVATE_KEY:
        description: "Only with sign: true (the cosign-signing environment's)"
        required: false
      COSIGN_PASSWORD:
        description: "Only with sign: true"
        required: false
    outputs:
      digest:
        value: ${{ jobs.promote.outputs.digest }}
      tags:
        value: ${{ jobs.promote.outputs.tags }}

# No workflow-level `permissions: {}`: every job below names its own except
# `alert`, which takes exactly what the caller's job grants. Asking for
# `issues: write` here would fail every run of every caller that does not
# grant it, on every event, before a single job started.

jobs:
  resolve:
    name: resolve
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && inputs.outside-image != '')
    # Same pool as build in a private repo (a308): GitHub-hosted jobs there have no minutes.
    runs-on: ${{ github.repository_visibility == 'private' && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      digest: ${{ steps.r.outputs.digest }}
      rebuild: ${{ steps.r.outputs.rebuild }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crunchtools/constitution
          ref: ${{ inputs.constitution-ref || 'v2.0.0' }}
          path: .constitution
          persist-credentials: false
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          BRANCH: ${{ inputs.default-branch }}
          OUTSIDE: ${{ inputs.outside-image }}
          # Empty except on a pull request, which resolves against its base.
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # A floating major tag (v4) ends here with a notice and no digest, so
        # build, gates and promote all skip and the run is green (#176).
        run: |
          set -eu
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          python3 -I .constitution/scripts/container_release.py resolve --image "$IMAGE" \
            --branch "$BRANCH" --sha "$SHA" --base "$BASE" --outside "$OUTSIDE"

  build:
    name: build
    needs: resolve
    if: >-
      always() && (needs.resolve.result == 'skipped' ||
      (needs.resolve.result == 'success' && needs.resolve.outputs.rebuild == 'true'))
    # A private repo's runs go to our uncached pool, because GitHub-hosted jobs
    # there have no minutes (a308). Visibility comes from the github context, not
    # the event: a schedule's payload has no repository. Never the cached pool: this job holds
    # credentials. A private repo has no fork path to our runners. Public repos
    # stay on GitHub's machines, which is what keeps a credential off ours.
    runs-on: ${{ github.repository_visibility == 'private' && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      pushed: ${{ steps.push.outputs.pushed }}
      sha: ${{ steps.src.outputs.sha }}
    steps:
      # Registry logins go to a file under the job's temp directory (a308), never
      # to a default path. On our runners the nested container storage outlives
      # the job, and the runner's container does not. cosign's login goes there too.
      - name: Keep registry auth inside this job
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - id: src
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Free runner disk for a large image
        if: inputs.free-disk && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.src.outputs.sha }}
          persist-credentials: false
      - name: Build once
        id: build
        env:
          SHA: ${{ steps.src.outputs.sha }}
          FILE: ${{ inputs.containerfile }}
          CONTEXT: ${{ inputs.context }}
          BUILD_ARGS: ${{ inputs.build-args }}
          FORMAT: ${{ inputs.format }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          # The record promote's provenance names (#204): this run, not
          # whichever later run promotes the digest, and the trusted builder,
          # this reusable workflow at its ref (job.workflow_ref, not the caller's).
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BUILDER: ${{ job.workflow_ref }}
          WORKFLOW: ${{ github.workflow_ref }}
          RHSM: ${{ inputs.rhsm }}
          # Not named after the secret ids: podman 4.9 (the runner's) mounts
          # a secret whose id matches an environment variable empty, ignoring
          # src=, which failed every id=RHSM_ACTIVATION_KEY build.
          RHSM_KEY_VALUE: ${{ secrets.RHSM_ACTIVATION_KEY }}
          RHSM_ORG_VALUE: ${{ secrets.RHSM_ORG_ID }}
          # GitHub withholds Actions secrets from every run Dependabot triggers,
          # re-runs included, and decides that by github.actor (a805). Only its
          # pull request may build without them; any other keyless run fails.
          DEPENDABOT_PR: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' }}
          REDHAT_REGISTRY: ${{ inputs.redhat-registry }}
          RH_USER: ${{ secrets.REGISTRY_REDHAT_IO_USER }}
          RH_PASSWORD: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}
        run: |
          set -eu
          args=()
          while IFS= read -r kv; do [ -n "$kv" ] && args+=(--build-arg "$kv"); done <<< "$BUILD_ARGS"
          if [ "$REDHAT_REGISTRY" = true ]; then
            [ -n "$RH_USER" ] || { echo "redhat-registry: true but no REGISTRY_REDHAT_IO_USER" >&2; exit 1; }
            printf '%s' "$RH_PASSWORD" | podman login -u "$RH_USER" --password-stdin registry.redhat.io
          fi
          if [ "$RHSM" = true ] && [ -z "$RHSM_KEY_VALUE" ] && [ "$DEPENDABOT_PR" = true ]; then
            # The profile's Containerfile guard ([ -s /run/secrets/activation_key ])
            # skips registration when no secret is mounted. push never pushes
            # this image, even with Quay credentials, so the merge rebuilds it.
            echo "::notice::Dependabot pull request gets no RHSM_ACTIVATION_KEY; building without the subscription"
            echo "unsubscribed=true" >> "$GITHUB_OUTPUT"
            RHSM=false
          fi
          if [ "$RHSM" = true ]; then
            # Files, not env=: the runner's podman predates env-sourced secrets.
            # 0600 in RUNNER_TEMP, removed below; the gates job never sees them.
            [ -n "$RHSM_KEY_VALUE" ] || { echo "rhsm: true but no RHSM_ACTIVATION_KEY" >&2; exit 1; }
            umask 077
            printf '%s' "$RHSM_KEY_VALUE" > "$RUNNER_TEMP/activation_key"
            printf '%s' "$RHSM_ORG_VALUE" > "$RUNNER_TEMP/org_id"
            # Both spellings are in the fleet's Containerfiles: id=activation_key
            # (rotv, nagios, rt) and id=RHSM_ACTIVATION_KEY (the ubi10 mariadb
            # and postgres images). An unused secret costs nothing.
            args+=(--secret "id=activation_key,src=$RUNNER_TEMP/activation_key")
            args+=(--secret "id=org_id,src=$RUNNER_TEMP/org_id")
            args+=(--secret "id=RHSM_ACTIVATION_KEY,src=$RUNNER_TEMP/activation_key")
            args+=(--secret "id=RHSM_ORG_ID,src=$RUNNER_TEMP/org_id")
          fi
          trap 'rm -f "$RUNNER_TEMP/activation_key" "$RUNNER_TEMP/org_id"' EXIT
          # --pull=always and a fresh runner: no stale base, no stale layer
          # (the 2026-10-22 rotv incident). The docker format keeps HEALTHCHECK;
          # bootc images ask for oci.
          case "$FORMAT" in docker|oci) ;; *) echo "format must be docker or oci" >&2; exit 1 ;; esac
          podman build --pull=always --format "$FORMAT" "${args[@]}" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "com.crunchtools.build.run=$RUN" \
            --label "com.crunchtools.build.builder=$BUILDER" \
            --label "com.crunchtools.build.workflow=$WORKFLOW" \
            --label "com.crunchtools.build.commit=$SHA" \
            -f "$FILE" -t localhost/release:candidate "$CONTEXT"
      - id: push
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          IMAGE: ${{ inputs.image }}
          SHA: ${{ steps.src.outputs.sha }}
          PR: ${{ github.event.pull_request.number }}
          UNSUBSCRIBED: ${{ steps.build.outputs.unsubscribed }}
          FORMAT: ${{ inputs.format }}
        run: |
          set -eu
          if [ -z "$QUAY_USERNAME" ] || [ "$UNSUBSCRIBED" = true ]; then
            # Dependabot and forks get no secrets, and an rhsm image built
            # without the subscription must never reach a gated- or sha- tag:
            # gate from an archive, push nothing. The merge rebuilds and gates.
            echo "::notice::no registry credentials or no subscription; gating a local archive, nothing is pushed"
            # The archive keeps the build's format: an oci-archive drops the
            # HEALTHCHECK a docker build carries, and the healthcheck gate refuses it.
            podman save --format "$FORMAT-archive" -o "$RUNNER_TEMP/image.tar" localhost/release:candidate
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$QUAY_PASSWORD" | podman login -u "$QUAY_USERNAME" --password-stdin quay.io
          podman push --digestfile "$RUNNER_TEMP/digest" localhost/release:candidate "docker://$IMAGE:sha-$SHA"
          digest=$(cat "$RUNNER_TEMP/digest")
          if [ -n "$PR" ]; then
            skopeo copy --all --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:pr-$PR"
          fi
          podman logout quay.io
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::built once: $IMAGE@$digest (sha-$SHA)"
      - if: steps.push.outputs.pushed == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 3
      - name: Drop registry auth
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/docker"

  gates:
    name: gates
    needs: build
    if: always() && needs.build.result == 'success'
    # Our own runners when the organization names them (crunchtools/trentina's
    # security.yml is the model): the CALLER's same-repository pull request on
    # CACHED_RUNNER_LABEL, its push, schedule, manual run, release or merge
    # queue on UNCACHED_RUNNER_LABEL. A fork's or Dependabot's pull request, a
    # Dependabot branch, and every other event -- pull_request_target, comments,
    # workflow_run, whose code may be a stranger's -- stay on GitHub's machines.
    # Clearing a variable sends its jobs back to GitHub-hosted: the kill switch.
    # free-disk deletes GitHub's preinstalled toolchains with sudo, so it keeps
    # the job on GitHub's machines, except in a private repo, which has no
    # minutes there (a308): the uncached pool, whose runner has no toolchains
    # to delete.
    runs-on: >-
      ${{ inputs.free-disk
          && (github.repository_visibility == 'private' && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || contains(fromJSON('["push","schedule","workflow_dispatch","release","merge_group"]'), github.event_name)
          && !startsWith(github.ref, 'refs/heads/dependabot/')
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest') }}
    permissions:
      contents: read
    steps:
      - name: Free runner disk for a large image
        if: inputs.free-disk && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crunchtools/constitution
          ref: ${{ inputs.constitution-ref || 'v2.0.0' }}
          path: .constitution
          persist-credentials: false
      - if: needs.build.outputs.pushed == 'false'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-image
          path: ${{ runner.temp }}
      - name: The image under test, by digest
        id: img
        env:
          PUSHED: ${{ needs.build.outputs.pushed }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -eu
          if [ "$PUSHED" = true ]; then
            ref="$IMAGE@$DIGEST"
            podman pull --quiet "$ref" >/dev/null
          else
            ref=$(podman load -q -i "$RUNNER_TEMP/image.tar" | sed -n 's/^Loaded image: //p' | tail -1)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::gating $ref"
      - name: Boot gate (${{ inputs.boot }})
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
          PROFILE: ${{ inputs.boot }}
          BOOT_ENV: ${{ inputs.boot-env }}
          RUN_ARGS: ${{ inputs.boot-run-args }}
          CMD: ${{ inputs.boot-cmd }}
          UNITS: ${{ inputs.boot-units }}
          PORT: ${{ inputs.boot-port }}
          URLPATH: ${{ inputs.boot-path }}
          TIMEOUT: ${{ inputs.boot-timeout }}
          BOOT_COMMAND: ${{ inputs.boot-command }}
          NONE_REASON: ${{ inputs.boot-none-reason }}
        run: |
          set -eu
          case "$PROFILE" in
            command)
              [ -n "$BOOT_COMMAND" ] || { echo "boot: command needs boot-command" >&2; exit 1; }
              bash -euo pipefail -c "$BOOT_COMMAND"
              ;;
            none)
              [ -n "$NONE_REASON" ] || { echo "boot: none needs boot-none-reason" >&2; exit 1; }
              echo "::warning::boot gate skipped: $NONE_REASON"
              ;;
            mcp|mcp-http|systemd|healthcheck)
              envs=()
              while IFS= read -r kv; do [ -n "$kv" ] && envs+=(--env "$kv"); done <<< "$BOOT_ENV"
              python3 -I .constitution/scripts/container_release.py boot \
                --image "$IMAGE" --profile "$PROFILE" "${envs[@]}" \
                --run-args "$RUN_ARGS" --cmd "$CMD" --units "$UNITS" \
                --port "$PORT" --path "$URLPATH" --timeout "$TIMEOUT"
              ;;
            *) echo "boot: unknown profile '$PROFILE'" >&2; exit 1 ;;
          esac
      - name: Contract test
        if: inputs.contract-test != ''
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
          CONTRACT: ${{ inputs.contract-test }}
        run: bash -euo pipefail -c "$CONTRACT"

  # Marks what gates passed, or on a pull request what resolve reused
  # (outside-image), so the merge finds gated-<head> either way.
  mark:
    name: mark gated
    needs: [resolve, build, gates]
    if: >-
      always() && ((needs.gates.result == 'success' && needs.build.outputs.pushed == 'true') ||
      (github.event_name == 'pull_request' && needs.resolve.outputs.digest != ''))
    # A private repo's runs go to our uncached pool, because GitHub-hosted jobs
    # there have no minutes (a308). Visibility comes from the github context, not
    # the event: a schedule's payload has no repository. Never the cached pool: this job holds
    # credentials. A private repo has no fork path to our runners. Public repos
    # stay on GitHub's machines, which is what keeps a credential off ours.
    runs-on: ${{ github.repository_visibility == 'private' && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      # Registry logins go to a file under the job's temp directory (a308), never
      # to a default path. On our runners the nested container storage outlives
      # the job, and the runner's container does not. cosign's login goes there too.
      - name: Keep registry auth inside this job
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crunchtools/constitution
          ref: ${{ inputs.constitution-ref || 'v2.0.0' }}
          path: .constitution
          persist-credentials: false
      - env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.build.outputs.digest || needs.resolve.outputs.digest }}
          SHA: ${{ needs.build.outputs.sha || needs.resolve.outputs.sha }}
        run: |
          set -eu
          if [ -z "$QUAY_USERNAME" ]; then
            # A reuse on a Dependabot or fork PR: the merge resolves it again.
            echo "::notice::no registry credentials; gated-$SHA not written"
            exit 0
          fi
          printf '%s' "$QUAY_PASSWORD" | skopeo login -u "$QUAY_USERNAME" --password-stdin quay.io
          python3 -I .constitution/scripts/container_release.py mark \
            --image "$IMAGE" --digest "$DIGEST" --sha "$SHA"
      - name: Drop registry auth
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/docker"

  promote:
    name: promote
    needs: [resolve, build, gates, mark]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', inputs.default-branch)) &&
      ((needs.resolve.result == 'success' && needs.resolve.outputs.digest != '') || needs.mark.result == 'success')
    # A private repo's runs go to our uncached pool, because GitHub-hosted jobs
    # there have no minutes (a308). Visibility comes from the github context, not
    # the event: a schedule's payload has no repository. Never the cached pool: this job holds
    # credentials. A private repo has no fork path to our runners. Public repos
    # stay on GitHub's machines, which is what keeps a credential off ours.
    runs-on: ${{ github.repository_visibility == 'private' && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    # An empty name is no environment: a caller without sign never touches
    # (or auto-creates) cosign-signing.
    environment: ${{ inputs.sign && 'cosign-signing' || '' }}
    # Check-then-copy must not interleave; never cancel a promotion halfway.
    # Keyed on the image, not the repo: a repo that releases two images must not
    # have one image's queued promote cancel the other's pending one (a693).
    concurrency:
      group: container-promote-${{ inputs.image }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.p.outputs.digest }}
      tags: ${{ steps.p.outputs.tags }}
    steps:
      # Registry logins go to a file under the job's temp directory (a308), never
      # to a default path. On our runners the nested container storage outlives
      # the job, and the runner's container does not. cosign's login goes there too.
      - name: Keep registry auth inside this job
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crunchtools/constitution
          ref: ${{ inputs.constitution-ref || 'v2.0.0' }}
          path: .constitution
          persist-credentials: false
      # The check and the copies read REGISTRY_AUTH_FILE from here. Only this
      # step and the sign step (cosign's own login, into DOCKER_CONFIG) see the
      # password: on stdin, masked, and both files sit in $RUNNER_TEMP, which
      # "Drop registry auth" clears whatever the outcome.
      - name: Log in to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: printf '%s' "$QUAY_PASSWORD" | skopeo login -u "$QUAY_USERNAME" --password-stdin quay.io
      # resolve runs only on push; a dispatch or schedule run on a v* ref
      # comes here without it. Refused before anything is signed (#146),
      # including a release whose image is labelled another of its releases (#171).
      # A floating major tag (v4) is skipped with a notice, not refused (#176):
      # skip=true and nothing below signs or moves.
      - name: Refuse a digest or tag promote must not take
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          BRANCH: ${{ inputs.default-branch }}
        run: |
          python3 -I .constitution/scripts/container_release.py check \
            --image "$IMAGE" --digest "$DIGEST" --branch "$BRANCH"
      # Signed before promote copies, so no tag ever points at an unsigned
      # digest. cosign v2: v3 stores signatures as OCI referrers, which
      # c/image (and so bootc and podman auto-update) cannot read; c/image
      # does not check Rekor, so nothing is uploaded there. A run that promote
      # then supersedes leaves a signed digest of a commit on main, untagged.
      - name: Install cosign v2.6.5
        if: inputs.sign && steps.check.outputs.skip != 'true'
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  $RUNNER_TEMP/cosign" | sha256sum -c
          # No sudo: our runners have none (a308).
          install -D -m 0755 "$RUNNER_TEMP/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign the digest being promoted
        if: inputs.sign && steps.check.outputs.skip != 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          PUB: .constitution/keys/crunchtools-bootc.pub
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the digest to sign is not a sha256 digest" >&2; exit 1; }
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "::error::sign: true but no COSIGN_PRIVATE_KEY: pass it by name from the cosign-signing environment; nothing was promoted" >&2; exit 1; }
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"
          cmp -s "$RUNNER_TEMP/secret.pub" "$PUB" || { echo "::error::COSIGN_PRIVATE_KEY is not the private half of keys/crunchtools-bootc.pub" >&2; exit 1; }
          printf '%s' "$QUAY_PASSWORD" | cosign login quay.io -u "$QUAY_USERNAME" --password-stdin
          if cosign verify --insecure-ignore-tlog --key "$PUB" "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            echo "::notice::$IMAGE@$DIGEST is already signed (a release of a digest main promoted)"
          else
            cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          fi
          cosign verify --insecure-ignore-tlog --key "$PUB" "$IMAGE@$DIGEST" >/dev/null
          echo "::notice::signed $IMAGE@$DIGEST"
      # The SBOM is attested to the same digest with the same key, before any
      # tag moves (#203). cosign v2 stores it as a separate .att object, so the
      # manifest bootc and podman pull is unchanged. syft reads the digest from
      # the registry with the login the sign step wrote to DOCKER_CONFIG.
      - name: Install syft v1.57.0
        if: inputs.sign && steps.check.outputs.skip != 'true'
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.57.0/syft_1.57.0_linux_amd64.tar.gz
          echo "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP" syft
          install -D -m 0755 "$RUNNER_TEMP/syft" "$RUNNER_TEMP/bin/syft"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # syft parses the image's contents, so it runs without the key, like
      # the provenance writer below; only the cosign attest step holds it.
      - name: Write the SBOM of the digest being promoted
        id: sbom
        if: inputs.sign && steps.check.outputs.skip != 'true'
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          PUB: .constitution/keys/crunchtools-bootc.pub
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          if cosign verify-attestation --insecure-ignore-tlog --type spdxjson --key "$PUB" "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            echo "::notice::$IMAGE@$DIGEST already carries an SBOM (a release of a digest main promoted)"
            echo "attest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          syft scan "registry:$IMAGE@$DIGEST" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
          echo "attest=true" >> "$GITHUB_OUTPUT"
      - name: Attest the SBOM of the digest being promoted
        if: inputs.sign && steps.check.outputs.skip != 'true' && steps.sbom.outputs.attest == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          PUB: .constitution/keys/crunchtools-bootc.pub
        run: |
          set -euo pipefail
          cosign attest --yes --tlog-upload=false --type spdxjson \
            --predicate "$RUNNER_TEMP/sbom.spdx.json" --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify-attestation --insecure-ignore-tlog --type spdxjson --key "$PUB" "$IMAGE@$DIGEST" >/dev/null
          echo "::notice::attested the SBOM of $IMAGE@$DIGEST"
      # Provenance names the run that built the digest, usually a pull
      # request's, read from the labels build wrote, never this promote run
      # (#204). A digest with no such record (built before #204) gets none,
      # with a warning, rather than a predicate naming the wrong builder.
      # Written without the key; only the cosign attest step below holds it.
      - name: Write the provenance of the digest being promoted
        id: provenance
        if: inputs.sign && steps.check.outputs.skip != 'true'
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          PUB: .constitution/keys/crunchtools-bootc.pub
        run: |
          set -euo pipefail
          if cosign verify-attestation --insecure-ignore-tlog --type slsaprovenance1 --key "$PUB" "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            echo "::notice::$IMAGE@$DIGEST already carries provenance (a release of a digest main promoted)"
            echo "attest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f "$RUNNER_TEMP/provenance.json"
          python3 -I .constitution/scripts/container_release.py provenance \
            --image "$IMAGE" --digest "$DIGEST" --out "$RUNNER_TEMP/provenance.json"
          if [ -e "$RUNNER_TEMP/provenance.json" ]; then
            echo "attest=true" >> "$GITHUB_OUTPUT"
          else
            echo "attest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest the provenance of the digest being promoted
        if: inputs.sign && steps.check.outputs.skip != 'true' && steps.provenance.outputs.attest == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          PUB: .constitution/keys/crunchtools-bootc.pub
        run: |
          set -euo pipefail
          cosign attest --yes --tlog-upload=false --type slsaprovenance1 \
            --predicate "$RUNNER_TEMP/provenance.json" --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify-attestation --insecure-ignore-tlog --type slsaprovenance1 --key "$PUB" "$IMAGE@$DIGEST" >/dev/null
          echo "::notice::attested the provenance of $IMAGE@$DIGEST"
      - id: p
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.resolve.outputs.digest || needs.build.outputs.digest }}
          BRANCH: ${{ inputs.default-branch }}
          CASCADE: ${{ inputs.cascade && '--cascade' || '' }}
        run: |
          set -eu
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          python3 -I .constitution/scripts/container_release.py promote \
            --image "$IMAGE" --digest "$DIGEST" --branch "$BRANCH" $CASCADE
      - name: What was promoted
        if: steps.check.outputs.skip != 'true'
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.p.outputs.digest }}
          TAGS: ${{ steps.p.outputs.tags }}
          SIGN: ${{ inputs.sign }}
        run: |
          {
            echo "### Promoted, not rebuilt"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            for t in $TAGS; do echo "- \`$t\`"; done
            [ -n "$TAGS" ] || echo "Nothing moved: a newer commit owns the branch."
            echo
            if [ "$SIGN" = true ]; then
              echo "Signed: \`cosign verify --insecure-ignore-tlog --key crunchtools-bootc.pub $IMAGE@$DIGEST\`"
              echo
              echo "SBOM: \`cosign verify-attestation --insecure-ignore-tlog --type spdxjson --key crunchtools-bootc.pub $IMAGE@$DIGEST\`"
              echo
              echo "Provenance: \`cosign verify-attestation --insecure-ignore-tlog --type slsaprovenance1 --key crunchtools-bootc.pub $IMAGE@$DIGEST\`"
              echo
            fi
            echo "Rollback: \`skopeo copy --all --preserve-digests docker://$IMAGE:rollback-main docker://$IMAGE:main\` (or \`rollback-latest\` / \`latest\`)."
          } >> "$GITHUB_STEP_SUMMARY"
      # The token reaches only the repos it dispatches to, not the whole org.
      - name: Downstream repositories
        id: downstream
        if: inputs.downstream != '' && (contains(steps.p.outputs.tags, 'main') || contains(steps.p.outputs.tags, 'latest'))
        env:
          DOWNSTREAM: ${{ inputs.downstream }}
        # Whitespace alone names no repo; an empty `repositories` would mint an
        # org-wide token, so no output, and no token.
        run: |
          # -d '': every line, as the dispatch loop below splits it; read then
          # exits 1 at the end of input, which is not an error here.
          read -ra repos -d '' <<< "$DOWNSTREAM" || true
          if [ "${#repos[@]}" -gt 0 ]; then
            (IFS=,; echo "repos=${repos[*]}") >> "$GITHUB_OUTPUT"
          fi
      - name: Token for the downstream dispatch
        id: app
        if: steps.downstream.outputs.repos != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CRUNCHTOOLS_CI_CLIENT_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools
          repositories: ${{ steps.downstream.outputs.repos }}
          # repository_dispatch needs contents: write on the target.
          permission-contents: write
      - name: Rebuild what builds FROM this (${{ inputs.downstream-event }})
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOWNSTREAM: ${{ inputs.downstream }}
          EVENT: ${{ inputs.downstream-event }}
          SOURCE: ${{ github.repository }}
        run: |
          set -eu
          for r in $DOWNSTREAM; do
            if [ "crunchtools/$r" = "$SOURCE" ] && [ "$EVENT" = parent-image-updated ]; then
              echo "downstream $r is this repo: set downstream-event, or this rebuilds forever" >&2
              exit 1
            fi
            gh api "repos/crunchtools/$r/dispatches" -f "event_type=$EVENT" \
              -f "client_payload[source]=$SOURCE"
            echo "dispatched $r"
          done
      - name: Drop registry auth
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth.json" "$RUNNER_TEMP/docker"

  # A weekly rebuild that fails (errata that no longer build, the mt76 overlay
  # refusing a patch that stopped fitting) has to reach a person (a375). One
  # open issue per image, named in its title (a693): the first failure opens it,
  # every later one comments, and a passing schedule or default-branch dispatch
  # of that image closes it. The job runs
  # on both; release_alert.py files only for a failed schedule.
  alert:
    name: alert on a failed schedule
    needs: [resolve, build, gates, mark, promote]
    if: >-
      !cancelled() && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name)
    # Bookkeeping, never a verdict: a GitHub outage while closing the alert must
    # not turn a promoted release red, or skip a caller job that needs this one.
    continue-on-error: true
    # Same pools as build (a308). Holds no secret, only the caller's token.
    runs-on: ${{ github.repository_visibility == 'private' && vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest' }}
    # No `permissions:` key on purpose: see the comment above `jobs:`. A caller
    # that grants `issues: write` gets the issue; one that does not gets a warning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crunchtools/constitution
          ref: ${{ inputs.constitution-ref || 'v2.0.0' }}
          path: .constitution
          persist-credentials: false
      - name: Open or comment on the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          # A dispatch of another branch is not the default branch's verdict.
          EVENT: >-
            ${{ (github.event_name == 'workflow_dispatch' &&
                 github.ref != format('refs/heads/{0}', inputs.default-branch))
                && 'other' || github.event_name }}
          IMAGE: ${{ inputs.image }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 -I .constitution/scripts/release_alert.py
          --needs "$NEEDS" --event "$EVENT" --repo "$GITHUB_REPOSITORY"
          --image "$IMAGE" --sha "$SHA" --run-url "$RUN_URL"
