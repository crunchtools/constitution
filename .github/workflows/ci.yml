name: Validate Constitutions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdlc:
    name: sdlc ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release is read from .pre-commit-config.yaml, so one line pins the
      # launcher, the image and every tool in it, for the laptop and CI both.
      - name: sdlc ci
        run: |
          set -eu
          rev=$(awk '/repo: https:\/\/github.com\/crunchtools\/python-sdlc/ {f=1; next}
                     f && /rev:/ {print $2; exit}' .pre-commit-config.yaml)
          [ -n "$rev" ] || { echo "no python-sdlc rev in .pre-commit-config.yaml" >&2; exit 2; }
          git clone -q --depth 1 --branch "$rev" https://github.com/crunchtools/python-sdlc "$RUNNER_TEMP/sdlc"
          $RUNNER_TEMP/sdlc/bin/sdlc ci

  # This repo's own checks: the validator run against fixture constitutions
  # that must pass and fixture constitutions that must fail. They are tests,
  # and they belong in tests/ where `sdlc ci` would run them -- written as
  # shell assertions in YAML they are outside the gate. Porting them is
  # tracked separately; until then they keep running here.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate test constitutions (should pass)
        run: |
          echo "=== Valid MCP Server ==="
          python validate-constitution.py tests/valid-mcp-server.md --verbose

          echo ""
          echo "=== Valid Container Image ==="
          python validate-constitution.py tests/valid-container-image.md --verbose

          echo ""
          echo "=== Valid Autonomous Agent ==="
          python validate-constitution.py tests/valid-autonomous-agent.md --verbose

          echo ""
          echo "=== Valid Web Application ==="
          python validate-constitution.py tests/valid-web-application.md --verbose

      - name: Validate invalid constitution (should fail)
        run: |
          echo "=== Invalid (missing Inherits) — expecting failure ==="
          if python validate-constitution.py tests/invalid-missing-inherits.md; then
            echo "ERROR: Validator should have failed but passed!"
            exit 1
          else
            echo "PASS: Validator correctly caught violations"
          fi

      - name: Claude Skill SKILL.md checks
        run: |
          echo "=== Valid SKILL.md — expecting pass ==="
          python validate-constitution.py tests/valid-claude-skill.md --skill-dir tests/skills/valid --verbose
          echo ""
          echo "=== Broken SKILL.md — expecting three specific violations ==="
          if out=$(python validate-constitution.py tests/valid-claude-skill.md --skill-dir tests/skills/broken); then
            echo "ERROR: Validator should have failed but passed!"
            exit 1
          fi
          echo "$out"
          for expected in "Missing frontmatter field 'argument-hint'" \
                          "Workflow structure missing numbered Phases" \
                          "Possible hardcoded credentials detected"; do
            grep -qF "$expected" <<<"$out" || { echo "ERROR: missing '$expected'"; exit 1; }
          done
          echo "PASS: Validator correctly caught SKILL.md violations"
          echo ""
          echo "=== Malformed frontmatter — expecting the matching violation ==="
          for case in "no-frontmatter:SKILL.md missing YAML frontmatter" \
                      "unclosed-frontmatter:SKILL.md has unclosed YAML frontmatter"; do
            dir="${case%%:*}"; expected="${case#*:}"
            out=$(python validate-constitution.py tests/valid-claude-skill.md --skill-dir "tests/skills/$dir") && { echo "ERROR: $dir passed"; exit 1; }
            grep -qF "$expected" <<<"$out" || { echo "ERROR: $dir missing '$expected'"; echo "$out"; exit 1; }
          done
          echo "PASS: Validator correctly caught malformed frontmatter"

      - name: XII quality-gate wiring (v1.17.0+)
        run: |
          echo "=== Hooks + triage present — expecting pass ==="
          python validate-constitution.py tests/repos/gates-ok/.specify/memory/constitution.md --verbose
          echo ""
          echo "=== Bare gatehouse hook, no triage job — expecting failure ==="
          if python validate-constitution.py tests/repos/gates-missing/.specify/memory/constitution.md; then
            echo "ERROR: Validator should have failed but passed!"
            exit 1
          fi
          echo "PASS: Validator correctly caught violations"

      - name: Validate profile documents reference themselves
        run: |
          echo "Checking profile documents exist and are non-empty..."
          test -s constitution.md || { echo "FAIL: constitution.md missing or empty"; exit 1; }
          test -s profiles/mcp-server.md || { echo "FAIL: profiles/mcp-server.md missing or empty"; exit 1; }
          test -s profiles/container-image.md || { echo "FAIL: profiles/container-image.md missing or empty"; exit 1; }
          test -s profiles/claude-skill.md || { echo "FAIL: profiles/claude-skill.md missing or empty"; exit 1; }
          test -s profiles/autonomous-agent.md || { echo "FAIL: profiles/autonomous-agent.md missing or empty"; exit 1; }
          test -s profiles/web-application.md || { echo "FAIL: profiles/web-application.md missing or empty"; exit 1; }
          echo "All profile documents present"
