# Required check for this repo, pinned like every fleet repo: a PR is judged by
# the last release's validator, never the one it changes (ci.yml tests the
# candidate). That holds for a release PR too: it leaves this pin and Inherits
# on the last release, and scripts/fleet-bump.py moves both after the tag.
# Calling validate.yml by local path, as #34 and #41 did, cannot work since
# v1.19.1: validate.yml checks out its own release tag, which a release PR
# names before it exists (#45).

name: Constitution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  constitution:
    name: Constitution
    uses: crunchtools/constitution/.github/workflows/validate.yml@v1.20.0
