# Required check for this repo, pinned like every fleet repo: a PR is judged by
# the last release's validator, never the one it changes (ci.yml tests the
# candidate). scripts/fleet-bump.py moves this pin with Inherits.

name: Constitution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  constitution:
    name: Constitution
    uses: crunchtools/constitution/.github/workflows/validate.yml@v1.18.0
