# Runs this repo's candidate container-release.yml end to end on a canary
# image, so the workflow is proven before any release tag ships it. A pull
# request builds, gates and marks; the merge promotes the PR's digest to
# :main without rebuilding. The refusal paths are unit-tested in
# tests/test_container_release.py.

name: Container release canary

on:
  pull_request:
    paths:
      - .github/workflows/container-release.yml
      - .github/workflows/container-release-canary.yml
      - scripts/container_release.py
      - tests/canary/**
  push:
    branches: [main]
    paths:
      - .github/workflows/container-release.yml
      - .github/workflows/container-release-canary.yml
      - scripts/container_release.py
      - tests/canary/**
  schedule:
    # Weekly, like every container repo: a ubi-minimal or runner change that
    # breaks the workflow shows up here before a release ships it.
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      rollback-drill:
        description: "Instead of a release run: put :main back on :rollback-main with the documented copy, and verify"
        type: boolean
        default: false

permissions: {}

jobs:
  canary:
    if: ${{ !inputs.rollback-drill }}
    uses: ./.github/workflows/container-release.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/container-release-canary
      containerfile: tests/canary/Containerfile
      context: tests/canary
      boot: healthcheck
      boot-timeout: 60
      constitution-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # The rollback runbook (profiles/container-image.md) is one digest copy. This
  # runs exactly that command against the canary and proves :main lands on the
  # digest :rollback-main held (RT#1550 E1). Dispatch-only; never on a release.
  rollback-drill:
    if: ${{ inputs.rollback-drill }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      IMAGE: quay.io/crunchtools/container-release-canary
    steps:
      - name: Copy rollback-main to main and verify
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          digest() { skopeo inspect --raw "docker://$IMAGE:$1" | sha256sum | cut -d' ' -f1; }
          printf '%s' "$QUAY_PASSWORD" | skopeo login -u "$QUAY_USERNAME" --password-stdin quay.io
          want=$(digest rollback-main); before=$(digest main)
          echo "main=$before rollback-main=$want"
          [ "$want" != "$before" ] || { echo "rollback-main already equals main; nothing to drill" >&2; exit 1; }
          skopeo copy --all --preserve-digests "docker://$IMAGE:rollback-main" "docker://$IMAGE:main"
          after=$(digest main)
          echo "main after rollback=$after"
          [ "$after" = "$want" ] || { echo "rollback did not land: main=$after want=$want" >&2; exit 1; }
