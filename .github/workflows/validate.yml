# Reusable constitution validation (issue #22).
#
# Callers pin this file to a release tag:
#
#   uses: crunchtools/constitution/.github/workflows/validate.yml@v1.22.1
#
# That tag IS the version the repo is judged by: the validator, profiles and
# requirements.toml are checked out at the release this file belongs to,
# never at HEAD. That release is written below as a literal (`ref:`), and
# tests/test_manifest.py fails when it is not this constitution's version: a
# reusable workflow has no context that names its own ref. Until v1.19.1 this
# read `github.job_workflow_sha`, which is empty, so every pinned repo was
# validated against main (#42). Copy examples/constitution.yml.

name: Constitution

on:
  workflow_call:
    inputs:
      constitution:
        description: Path to the repo's manifest constitution
        type: string
        default: .specify/memory/constitution.md

permissions: {}

jobs:
  validate:
    name: Validate constitution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: crunchtools/constitution
          ref: v1.22.1
          path: .constitution
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.3
      - name: Validate
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.constitution }}
        run: python .constitution/validate-constitution.py "$MANIFEST" --pinned --freshness --verbose
