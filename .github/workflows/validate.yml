# Reusable constitution validation (issue #22).
#
# Callers name the major tag, which each release moves (XV rule 5):
#
#   uses: crunchtools/constitution/.github/workflows/validate.yml@v1
#
# The validator, profiles and requirements.toml are checked out at the release
# this file belongs to, never at HEAD; the repo is judged by the rules of the
# version its `Inherits:` names. That release is written below as a literal (`ref:`), and
# tests/test_manifest.py fails when it is not this constitution's version: a
# reusable workflow has no context that names its own ref. Until v1.19.1 this
# read `github.job_workflow_sha`, which is empty, so every pinned repo was
# validated against main (#42). Copy examples/constitution.yml.

name: Constitution

on:
  workflow_call:
    inputs:
      constitution:
        description: Path to the repo's manifest constitution
        type: string
        default: .specify/memory/constitution.md

permissions: {}

jobs:
  validate:
    name: Validate constitution
    # Our own runners when the organization names them (crunchtools/trentina's
    # security.yml is the model): the CALLER's same-repository pull request on
    # CACHED_RUNNER_LABEL, its push, schedule, manual run, release or merge
    # queue on UNCACHED_RUNNER_LABEL. A fork's or Dependabot's pull request, a
    # Dependabot branch, and every other event -- pull_request_target, comments,
    # workflow_run, whose code may be a stranger's -- stay on GitHub's machines.
    # Clearing a variable sends its jobs back to GitHub-hosted: the kill switch.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || contains(fromJSON('["push","schedule","workflow_dispatch","release","merge_group"]'), github.event_name)
          && !startsWith(github.ref, 'refs/heads/dependabot/')
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: crunchtools/constitution
          ref: v1.49.0
          path: .constitution
          persist-credentials: false
      # setup-python has no build for our runners' Fedora, so it runs only on
      # GitHub's machines; ours bring their own python3. A venv either way, so
      # pip never touches a system Python.
      - if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.3
      - name: Validate
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.constitution }}
        run: '"$RUNNER_TEMP/venv/bin/python" .constitution/validate-constitution.py "$MANIFEST" --pinned --freshness --verbose'
