# Reusable dependency CVE scan for uv projects (XV).
#
# Callers name the major tag, which each release moves (XV rule 5):
#
#   jobs:
#     dependency-audit:
#       permissions:
#         contents: read
#         issues: write
#       uses: crunchtools/constitution/.github/workflows/dependency-audit.yml@v1
#
# from a workflow that runs on pull_request, on push to the default branch and on
# a weekly schedule. A pull request with a vulnerable dependency fails. On the
# default branch scripts/audit_alert.py keeps one alert issue in step with the
# scan: created or rewritten while anything is vulnerable, closed by the first
# clean scan, so a fix closes it minutes after it merges. The script is checked
# out at this file's release, written below as a literal (`ref:`) because a
# reusable workflow cannot name its own ref (#42). Copy examples/security.yml.

name: Dependency audit

on:
  workflow_call:
    inputs:
      python-version:
        description: Python the project is synced with
        type: string
        default: "3.12"

permissions: {}

jobs:
  audit:
    name: Dependency CVE Scan
    # Our own runners when the organization names them (crunchtools/trentina's
    # security.yml is the model): the CALLER's same-repository pull request on
    # CACHED_RUNNER_LABEL, its push, schedule, manual run, release or merge
    # queue on UNCACHED_RUNNER_LABEL. A fork's or Dependabot's pull request, a
    # Dependabot branch, and every other event -- pull_request_target, comments,
    # workflow_run, whose code may be a stranger's -- stay on GitHub's machines.
    # Clearing a variable sends its jobs back to GitHub-hosted: the kill switch.
    runs-on: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && (vars.CACHED_RUNNER_LABEL || 'ubuntu-latest')
          || contains(fromJSON('["push","schedule","workflow_dispatch","release","merge_group"]'), github.event_name)
          && !startsWith(github.ref, 'refs/heads/dependabot/')
          && (vars.UNCACHED_RUNNER_LABEL || 'ubuntu-latest')
          || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crunchtools/constitution
          ref: v2.0.0
          path: .constitution
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"
      - name: Set up Python
        env:
          PYTHON: ${{ inputs.python-version }}
        run: uv python install "$PYTHON"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pip-audit
        # pip-audit exits 1 when it finds vulnerabilities; audit_alert.py decides
        # from the report and renders the issue's table from it. A missing or
        # unparseable report fails that step, never reads as clean: that is how
        # twelve copies of this went silent.
        # --with keeps pip-audit out of the project's own synced environment.
        run: uv run --with pip-audit pip-audit --format=json --output=audit-results.json || true
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 30
      - name: Fail the PR, or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          # A push to another branch is not the default branch's verdict.
          EVENT: >-
            ${{ (github.event_name == 'push' &&
                 github.ref_name != github.event.repository.default_branch)
                && 'other' || github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .constitution/scripts/audit_alert.py
          --json audit-results.json
          --event "$EVENT" --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"
