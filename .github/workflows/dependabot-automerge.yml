# Reusable Dependabot auto-merge (issue #22, approved 2026-09-23).
#
# DEPRECATED (a851): repos move to the shared Renovate preset (renovate/default.json),
# which merges through GitHub's own auto-merge and needs no workflow. This keeps
# working for repos not yet swapped by `scripts/fleet-bump.py --renovate`; the
# validator stops accepting Dependabot at v1.60.0 and this file goes with it.
#
# Queues minor and patch updates in every ecosystem for auto-merge. The merge
# happens only once every required check is green, so this never bypasses a
# gate. Majors, and updates Dependabot cannot classify, wait for a human.
# Requires `allow_auto_merge` on the repo. Copy examples/dependabot-automerge.yml.

name: Dependabot auto-merge

on:
  workflow_call:

permissions: {}

jobs:
  automerge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Queue minor/patch updates
        # An allowlist, not "not major": an update fetch-metadata cannot
        # classify (empty update-type) waits for a human like a major does.
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Repos allow different merge methods; take the first one enabled.
          for method in squash merge rebase; do
            if gh pr merge --auto "--$method" "$PR"; then exit 0; fi
          done
          exit 1
