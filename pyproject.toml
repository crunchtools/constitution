# The [project] table exists so `uv lock` can pin the gate's own tools; the
# scripts are standalone and run by path, not an installable package, which is
# what `package = false` says. Without a lockfile naming mypy and
# pytest the gate exits 2 (python-sdlc, need_lock_dep).
[project]
name = "constitution"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "pyyaml>=6.0.3", "types-PyYAML>=6.0.12"]

[tool.ruff]
line-length = 100
# The tests import the scripts from scripts/.
src = [".", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 12

[tool.mypy]
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# semgrep: no in-repo rules, and the check exits 2 when .semgrep is absent
# rather than scanning nothing and calling it a pass.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["governance"]

# What ci.yml's own jobs ran beside `sdlc ci`, as scripts sdlc runs.
[tool.sdlc.ci]
checks = ["renovate-config"]

# The Renovate preset and configs, judged by the Renovate sdlc's gate image
# ships (was ci.yml's `renovate` job).
[tool.sdlc.ci.renovate-config]
kind = "command"
argv = ["bash", "tests/renovate/validate.sh"]
