# The [project] table exists so `uv lock` can pin the gate's own tools; the
# validators are standalone scripts run by path, not an installable package,
# which is what `package = false` says. Without a lockfile naming mypy and
# pytest the gate exits 2 (python-sdlc, need_lock_dep).
[project]
name = "constitution"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "pyyaml>=6.0.3", "types-PyYAML>=6.0.12"]

# Lint configuration only: the validators are standalone scripts run by path
# (CI, and the validate-constitution pre-commit hook with `language: script`),
# not an installable package.

[tool.ruff]
line-length = 100
# scripts/ holds fleet_common, imported by the fleet scripts and tests.
src = [".", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C90", "PLR"]

# The profile checks are flat checklists (one `if` per requirement), so their
# branch count tracks the number of requirements, not nesting.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15

# The validators and the fleet scripts, by path.
[tool.mypy]
files = ["scripts", "tests", "validate-constitution.py", "validate-cascade.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.sdlc.push]
# semgrep: no in-repo rules, and the check exits 2 when .semgrep is absent
# rather than scanning nothing and calling it a pass.
#
# constitution: this is the one repo where that check cannot work. It clones
# the constitution at the version `Inherits:` names and validates against it --
# and in THIS repo that version is the one the pull request is creating, so the
# tag does not exist yet:
#
#     GATE CANNOT RUN: cannot clone the constitution at v1.31.0:
#     fatal: Remote branch v1.31.0 not found in upstream origin
#
# Skipping it loses nothing, because ci.yml validates this repo's own manifest
# with the CANDIDATE validator from the working tree -- which is strictly
# better than judging a manifest that declares v1.31.0 with v1.30.0's rules.
# That is the same reasoning the manifest already records for the required
# check: "a PR is never judged by the validator it changes".
skip = ["semgrep", "constitution"]
