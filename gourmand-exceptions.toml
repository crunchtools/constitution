# Gourmand exceptions: findings that are the repo's design, each with a reason.

[[exceptions]]
check = "CH008-summary_litter"
path = "constitution.md"
justification = "The org-level constitution is this repo's product. Every crunchtools repo and the Gatehouse Constitution agent link to constitution.md at the repo root by that path."
classification = "by_design"

# Ruff is not missing; it moved. Gourmand's IF001 looks for a literal
# `ruff-check` hook id, and under python-sdlc (constitution XII, v1.30.0) ruff
# runs inside the `sdlc-commit` hook, configured by [tool.ruff] in
# pyproject.toml. Same precedent as trentina.
[[exceptions]]
check = "linter_configuration"
path = ".pre-commit-config.yaml"
pattern = "ruff-check"
justification = "ruff runs inside the sdlc-commit hook from python-sdlc (constitution XII v1.30.0), configured by [tool.ruff] in pyproject.toml; Gourmand looks for a literal ruff hook id"
classification = "by_design"

[[exceptions]]
check = "CQ013-hardcoded_years"
path = "scripts/container_release.py"
item = "2025"
justification = "\"2025-06-18\" is the MCP protocol revision the boot gate sends in initialize, a protocol identifier and not a date that goes stale; servers negotiate down from it."
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "scripts/audit_alert.py"
justification = "release_alert.py shares its four-line gh() wrapper and the keep-the-oldest-alert, close-the-rest tail of plan(). Both run from a pinned checkout as `python3 -I .constitution/scripts/<name>.py`, and -I keeps the script's own directory off sys.path, so neither can import the other; a shared module would need a sys.path edit in each to save eight lines."
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "scripts/major_tag.py"
justification = "main() and release_alert.py's main() share only the argparse-then-try/except-a-known-error shape; they parse different arguments and handle different errors. Standalone `python3 -I` scripts cannot import a shared entry point (see scripts/audit_alert.py above)."
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "scripts/container_release.py"
item = "resolve"
justification = "resolve and outside_only share only a shape: a run of guard clauses, each returning (None, why), then the gated digest. They ask different questions (was this commit's merged PR gated; does this commit change only files outside the image) of different APIs. There is nothing to extract."
classification = "gourmand_bug"

[[exceptions]]
check = "EV010-single_use_helpers"
path = "scripts/container_release.py"
item = "_object"
justification = "GitHub._object has five callers (tree, parent, changed, tip, on_branch), not one; it is the one place a non-object API answer is refused."
classification = "gourmand_bug"

[[exceptions]]
check = "CH001-absolute_paths"
path = "pyproject.toml"
justification = "UV_PROJECT_ENVIRONMENT names a path inside the sdlc command check container, on the tmpfs sdlc mounts as its only writable place; no host path"
classification = "by_design"
